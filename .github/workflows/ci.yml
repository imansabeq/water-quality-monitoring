name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  firmware-build:
    name: Verify Arduino Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Arduino AVR Core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile Water Monitor Sketch
        run: |
          arduino-cli compile --fqbn arduino:avr:uno firmware/water_monitor/water_monitor.ino

  python-lint:
    name: Verify Python Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax Check Python Scripts
        run: |
          python -m py_compile cloud/serial_to_mqtt.py
          python -m py_compile cloud/consumer/mqtt_to_influx.py

  docker-build:
    name: Verify Docker Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f cloud/docker-compose.yml config

      - name: Build Custom Consumer Image
        run: |
          docker compose -f cloud/docker-compose.yml build mqtt-consumer