services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: water-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  influxdb:
    image: influxdb:2
    container_name: water-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: water-iot
      DOCKER_INFLUXDB_INIT_BUCKET: water_quality
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: water-quality-dev-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt-consumer:
    build: ./consumer
    container_name: water-mqtt-consumer
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: water/telemetry
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: water-quality-dev-token
      INFLUX_ORG: water-iot
      INFLUX_BUCKET: water_quality

  grafana:
    image: grafana/grafana:11.4.0
    container_name: water-grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  influxdb_data:
  grafana_data: