apiVersion: 1

datasources:
  - name: InfluxDB
    uid: water-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: water-iot
      defaultBucket: water_quality
    secureJsonData:
      token: water-quality-dev-token